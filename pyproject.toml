[project]
name = "atendente-ai"
version = "0.1.0"
description = "Agente de atendimento por mensagens da Empório da Música"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.4.0",
    "fastapi>=0.162.0",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "openai>=3.45.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/agent/prompts.py" = ["E501"]  # o prompt fica em linhas longas de propósito
