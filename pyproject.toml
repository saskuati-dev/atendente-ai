[project]
name = "atendente-ai"
version = "0.1.0"
description = "Agente de atendimento por mensagens da Empório da Música"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.2",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
